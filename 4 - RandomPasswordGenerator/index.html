<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Password Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Generate a <br><span>Random Password</span></h1>
    
    <div class="display">
        <input type="text" id="password" placeholder="Password" readonly>
        <!-- Copy SVG Icon -->
        <svg onclick="copyPassword()" style="width:24px;height:24px;cursor:pointer;" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
    </div>

    <button onclick="createPassword()">⚡ Generate Password</button>
</div>

<script src="script.js"></script>
</body>
</html>
